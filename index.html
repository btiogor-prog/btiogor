<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MarlyServe — POS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --primary: #E85D04;
      --muted: #6b7280;
    }
    .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f9fafb; padding: 1rem; }
    .login-box { background: white; width: 100%; max-width: 400px; padding: 2rem; border-radius: 1.5rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); border: 1px solid #e5e7eb; }
    .login-logo { background: var(--primary); color: white; width: 64px; height: 64px; display: flex; align-items: center; justify-content: center; border-radius: 50%; margin: 0 auto 1rem; font-weight: bold; font-size: 1.5rem; }
    .login-title { font-size: 1.875rem; font-weight: 700; text-align: center; color: #111827; }
    .login-sub { text-align: center; color: var(--muted); margin-bottom: 2rem; font-size: 0.875rem; }
    
    .mesero-grid { display: grid; grid-cols: 2; gap: 0.75rem; grid-template-columns: repeat(2, 1fr); }
    .btn { width: 100%; padding: 0.75rem; border-radius: 0.75rem; font-weight: 500; transition: all 0.2s; border: 1px solid #e5e7eb; }
    .btn-secondary { background: white; color: #374151; }
    .btn-secondary:active { background: #f3f4f6; transform: scale(0.98); }
    .btn-block { display: block; width: 100%; }
    
    /* PIN PAD Estilos */
    .pin-dots { display: flex; justify-content: center; gap: 1rem; margin-bottom: 2rem; }
    .pin-dot { width: 16px; height: 16px; border: 2px solid #d1d5db; border-radius: 50%; }
    .pin-dot.filled { background: var(--primary); border-color: var(--primary); }
    .pinpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; margin-bottom: 1.5rem; }
    .pin-key { background: #f9fafb; border: 1px solid #e5e7eb; padding: 1.25rem; border-radius: 1rem; font-size: 1.25rem; font-weight: 600; }
    .pin-key:active { background: #e5e7eb; }
    .alert-error { background: #fee2e2; color: #b91c1c; padding: 0.75rem; border-radius: 0.5rem; font-size: 0.875rem; text-align: center; }
  </style>
</head>
<body>

<div class="login-wrap">
  <div class="login-box">
    <div class="login-logo">MS</div>
    <h1 class="login-title">MarlyServe</h1>
    <p class="login-sub">Sistema de punto de venta</p>

    <div id="view-selector">
      <p class="text-sm text-center mb-3 text-gray-500 font-medium">¿Quién eres?</p>
      <div id="meseros-grid" class="mesero-grid">
        </div>
      <div class="border-t border-gray-100 mt-6 mb-4"></div>
      <button class="btn btn-secondary flex items-center justify-center gap-2" onclick="seleccionarAdmin()">
        🔐 Acceso administrador
      </button>
    </div>

    <div id="view-pin" style="display:none">
      <p class="text-sm text-center mb-4 font-bold text-gray-700" id="pin-titulo">PIN</p>
      <div class="pin-dots">
        <div class="pin-dot" id="d0"></div>
        <div class="pin-dot" id="d1"></div>
        <div class="pin-dot" id="d2"></div>
        <div class="pin-dot" id="d3"></div>
      </div>
      <div id="pin-error" class="alert-error mb-3" style="display:none"></div>
      <div class="pinpad">
        <button class="pin-key" onclick="pinKey('1')">1</button>
        <button class="pin-key" onclick="pinKey('2')">2</button>
        <button class="pin-key" onclick="pinKey('3')">3</button>
        <button class="pin-key" onclick="pinKey('4')">4</button>
        <button class="pin-key" onclick="pinKey('5')">5</button>
        <button class="pin-key" onclick="pinKey('6')">6</button>
        <button class="pin-key" onclick="pinKey('7')">7</button>
        <button class="pin-key" onclick="pinKey('8')">8</button>
        <button class="pin-key" onclick="pinKey('9')">9</button>
        <button class="pin-key" onclick="pinKey('←')">←</button>
        <button class="pin-key" onclick="pinKey('0')">0</button>
        <button class="pin-key" onclick="pinKey('✓')">✓</button>
      </div>
      <button class="btn btn-secondary w-full" onclick="volverSelector()">← Volver</button>
    </div>

    <div id="view-dashboard" style="display:none">
        <h2 class="text-xl font-bold mb-4">¡Bienvenido!</h2>
        <div id="folder-box" class="p-4 border-2 border-dashed rounded-xl mb-4">
            <button onclick="createFolder()" class="w-full bg-orange-600 text-white py-3 rounded-lg font-bold">Crear Carpeta Compartida</button>
        </div>
        <button onclick="location.reload()" class="text-sm text-gray-400 underline w-full text-center">Cerrar Sesión</button>
    </div>
  </div>
</div>

<script>
  // Datos temporales (Luego se conectarán a la base de datos en la nube)
  const meserosList = [
    { nombre: "Ana", pin: "1111", activo: true },
    { nombre: "Carlos", pin: "2222", activo: true },
    { nombre: "Lupita", pin: "3333", activo: true },
    { nombre: "Miguel", pin: "4444", activo: true }
  ];

  let pinBuffer = "";
  let pinTarget = null;

  // Renderizar meseros
  const grid = document.getElementById("meseros-grid");
  meserosList.forEach(m => {
    const btn = document.createElement("button");
    btn.className = "btn btn-secondary";
    btn.textContent = m.nombre;
    btn.onclick = () => seleccionarMesero(m);
    grid.appendChild(btn);
  });

  function seleccionarMesero(m) {
    pinTarget = { tipo: "mesero", data: m };
    document.getElementById("pin-titulo").textContent = `PIN DE ${m.nombre.toUpperCase()}`;
    mostrarPin();
  }

  function seleccionarAdmin() {
    pinTarget = { tipo: "admin", data: { pin: "0000" } };
    document.getElementById("pin-titulo").textContent = "PIN DE ADMINISTRADOR";
    mostrarPin();
  }

  function mostrarPin() {
    pinBuffer = "";
    actualizarDots();
    document.getElementById("pin-error").style.display = "none";
    document.getElementById("view-selector").style.display = "none";
    document.getElementById("view-pin").style.display = "block";
  }

  window.volverSelector = function() {
    document.getElementById("view-pin").style.display = "none";
    document.getElementById("view-selector").style.display = "block";
  };

  window.pinKey = function(k) {
    if (k === "←") {
      pinBuffer = pinBuffer.slice(0, -1);
      actualizarDots();
      return;
    }
    if (k === "✓") { validarPin(); return; }
    if (pinBuffer.length >= 4) return;
    pinBuffer += k;
    actualizarDots();
    if (pinBuffer.length === 4) {
      setTimeout(validarPin, 200); // Pequeña pausa para ver el último punto
    }
  };

  function actualizarDots() {
    for (let i = 0; i < 4; i++) {
      document.getElementById(`d${i}`).classList.toggle("filled", i < pinBuffer.length);
    }
  }

  function validarPin() {
    const errEl = document.getElementById("pin-error");
    let correcto = false;

    if (pinTarget.tipo === "mesero") {
      if (pinBuffer === pinTarget.data.pin) correcto = true;
    } else {
      if (pinBuffer === "0000") correcto = true;
    }

    if (correcto) {
      document.getElementById("view-pin").style.display = "none";
      document.getElementById("view-dashboard").style.display = "block";
    } else {
      errEl.textContent = "PIN INCORRECTO";
      errEl.style.display = "block";
      pinBuffer = "";
      actualizarDots();
    }
  }

  function createFolder() {
      const token = Math.random().toString(36).substr(2, 5).toUpperCase();
      alert("Carpeta Creada con Token: " + token);
  }
</script>
</body>
</html>
